{% extends "base.html" %}

{% block title %}Error — DataWhale AI{% endblock %}
{% block page_title %}Error{% endblock %}

{% block content %}
<div class="empty-state">
    <div class="empty-icon" style="color: var(--danger);">
        <i data-lucide="alert-circle"></i>
    </div>
    <h2>Something went wrong</h2>
    <p>{{ error }}</p>
    <a href="/" class="btn btn-primary" id="btn-back-home">
        <i data-lucide="home"></i>
        <span>Back to Dashboard</span>
    </a>
</div>
{% endblock %}
